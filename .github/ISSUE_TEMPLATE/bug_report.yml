name: 🐛 Ошибка / Bug report
description: Что-то работает не так / Something is broken
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Платформа / Platform
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что вы делали, что ожидали и что произошло вместо этого / What you did, what you expected, what happened instead
      placeholder: "Зажал горячую клавишу, начал диктовать, но…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика / Diagnostics
      description: "В приложении: Настройки → Основные → «Помощь и обратная связь» → «Скопировать диагностику» (или «Сохранить архив диагностики» и приложите файл). / In the app: Settings → General → \"Help & Feedback\" → \"Copy diagnostics\" (or \"Save diagnostics file\" and attach it)."
      render: text
  - type: input
    id: version
    attributes:
      label: Версия приложения / App version
      placeholder: "0.11.4 или Android 3.6 (Настройки → О программе / Settings → About)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Тип установки / Install type
      options:
        - Установщик Windows / Windows installer
        - Windows portable
        - Android APK
  - type: input
    id: gpu
    attributes:
      label: Видеокарта или модель телефона / GPU or phone model
      placeholder: "например RTX 3060 / e.g. RTX 3060, «нет GPU / no GPU», Xiaomi Redmi Note 12"
