name: 🐛 Ошибка / Bug report
description: Что-то работает не так / Something is broken
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Платформа / Platform
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: "Что вы делали, что ожидали и что произошло вместо этого. Архив диагностики перетащите сюда — вложения принимает только это поле. / What you did, what you expected, what happened instead. Drag the diagnostics file here — this is the field that takes attachments."
      placeholder: "Зажал горячую клавишу, начал диктовать, но…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика / Diagnostics
      description: "Windows: Настройки → Основные → «Помощь и обратная связь» → «Скопировать диагностику» (или «Сохранить архив диагностики» — файл перетащите в поле «Что случилось» выше). Android: такой кнопки нет — долгое нажатие на строку с версией внизу «Настроек» копирует версию и номер сборки, вставьте её сюда. / Windows: Settings → General → \"Help & Feedback\" → \"Copy diagnostics\" (or \"Save diagnostics file\" — drag the file into the \"What happened\" field above). Android: there is no such button — long-press the version row at the bottom of Settings to copy the version and build number, and paste it here."
      render: text
  - type: input
    id: os
    attributes:
      label: Версия ОС / OS version
      description: "Android: Настройки → О телефоне → Версия Android. Windows: Win+R → winver. / Android: Settings → About phone → Android version. Windows: Win+R → winver."
      placeholder: "Android 14 · Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения / App version
      description: "Windows: Настройки → О программе. Android: раздела «О программе» нет — версия последней строкой внизу «Настроек», долгое нажатие копирует её вместе с номером сборки. / Windows: Settings → About. Android: there is no About screen — the version is the last row at the bottom of Settings; long-press copies it together with the build number."
      placeholder: "0.15.7 или Android 3.31"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Тип установки / Install type
      options:
        - Установщик Windows / Windows installer
        - Windows portable
        - Android APK
  - type: input
    id: gpu
    attributes:
      label: Видеокарта или модель телефона / GPU or phone model
      placeholder: "например RTX 3060 / e.g. RTX 3060, «нет GPU / no GPU», Xiaomi Redmi Note 12"
